<!doctype html>

<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TuxMail Setup</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <div class="window" id="window">
    <header class="titlebar" style="--wails-draggable: drag">
      <img class="titlebar-icon" src="icon-32.png" alt="" width="18" height="18">
      <span class="titlebar-title" id="title">TuxMail Setup</span>
      <span class="titlebar-spacer"></span>
      <button class="tb-btn" data-action="minimise" id="tb-min" style="--wails-draggable: no-drag" aria-label="Minimieren">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10" /></svg>
      </button>
      <button class="tb-btn tb-close" data-action="quit" id="tb-close" style="--wails-draggable: no-drag" aria-label="Schließen">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
      </button>
    </header>
    <div class="body">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-penguin" src="penguin.png" alt="">
          <div class="brand-word">Tux<span>Mail</span></div>
          <div class="brand-version" id="brand-version"></div>
        </div>
        <ol class="steps" id="steps"></ol>
      </aside>
      <main class="main">
        <section class="content" id="content" aria-live="polite"></section>
        <footer class="footer" id="footer"></footer>
      </main>
    </div>
    <div class="modal-backdrop" id="modal" hidden></div>
  </div>
  <script src="i18n.js"></script>
  <script src="setup.js"></script>
</body>
</html>
