// Top-level build file of the TuxMail Android app (generated by Capacitor, adapted).

buildscript {
    // Same Kotlin version as the official Capacitor plugins (camera/filesystem).
    ext.kotlin_version = '2.4.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Only needed by the "play" flavor (FCM). F-Droid builds pass
        // -Ptuxmail.gms=false so no Google Gradle plugin is resolved at all.
        if (project.findProperty('tuxmail.gms') != 'false') {
            classpath 'com.google.gms:google-services:4.6.0'
        }
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
