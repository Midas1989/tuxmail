# Beispiel-Inventar. Kopieren nach inventory/hosts.ini und anpassen:
#   cp inventory/hosts.example.ini inventory/hosts.ini
#
# Allgemeine Werte: inventory/group_vars/all.yml
# Host-spezifische Werte: hier in der Zeile oder in inventory/host_vars/<host>.yml

[tuxmail]
mail.example.org ansible_host=203.0.113.10 ansible_user=deploy

# Beispiel: TuxMail als Unterpfad neben Nextcloud in einer vorhandenen nginx-Installation
# cloud.example.org ansible_user=root tuxmail_domain=cloud.example.org tuxmail_nginx_mode=existing tuxmail_nginx_existing_style=snippet tuxmail_subpath=/tuxmail tuxmail_tls_mode=none

# Build-Rechner für build/build-all.sh (Playbook build-env.yml, Rolle tuxmail_buildenv).
# Ohne Inventar geht es auch direkt auf dem Rechner: ansible-playbook build-env.yml -i localhost, -c local
# -e tuxmail_buildenv_hosts=localhost
[tuxmail_build]
# build.example.org ansible_user=root tuxmail_buildenv_repo_dir=/opt/tuxmail
