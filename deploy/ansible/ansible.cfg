# Ansible-Konfiguration für das TuxMail-Deployment.
# Wird automatisch verwendet, wenn ansible-playbook aus deploy/ansible/ aufgerufen wird.
[defaults]
inventory = inventory/hosts.ini
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = false
nocows = true

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
