---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Nginx darf auf den TuxMail-Socket zugreifen (Gruppe)
  ansible.builtin.user:
    name: "{{ tuxmail_nginx_user_effective }}"
    groups: "{{ tuxmail_socket_group }}"
    append: true
  when: tuxmail_listen_is_socket | bool
  notify: tuxmail nginx reload

- name: SELinux – nginx darf Netzwerkverbindungen zu TuxMail aufbauen
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - tuxmail_nginx_manage_selinux | bool
    - ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
    - not (tuxmail_listen_is_socket | bool)
  block:
    - name: Python-Bindings für SELinux-Verwaltung installieren
      ansible.builtin.dnf:
        name:
          - python3-libselinux
          - python3-libsemanage
        state: present

    - name: Boolean httpd_can_network_connect setzen
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true

- name: ACME-Webroot anlegen
  ansible.builtin.file:
    path: "{{ tuxmail_acme_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tuxmail_tls_mode == 'letsencrypt'

- name: Prüfskript für einzelne nginx-Konfigurationsdateien installieren
  ansible.builtin.copy:
    src: tuxmail-nginx-check
    dest: /usr/local/sbin/tuxmail-nginx-check
    owner: root
    group: root
    mode: "0755"
