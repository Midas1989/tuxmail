---
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Rolle tuxmail – Binary, Konfiguration, systemd-Dienst, Backups, Admin.
# Gemeinsame Variablen (tuxmail_version, tuxmail_domain, Pfade, ...) stehen in
# roles/tuxmail_common/defaults/main.yml.

# --- Bezugsquelle des Binaries ------------------------------------------------
# Basis-URL der Release-Dateien (mit abschließendem "/").
tuxmail_release_base_url: "https://github.com/Midas1989/Mailclient/releases/download/v{{ tuxmail_version }}/"
# Architektur-Zuordnung (Ansible-Fakt -> Release-Name).
tuxmail_arch_map:
  x86_64: amd64
  amd64: amd64
  aarch64: arm64
  arm64: arm64
tuxmail_arch: "{{ tuxmail_arch_map.get(ansible_facts['architecture'], 'unsupported') }}"
tuxmail_archive_name: "tuxmail_{{ tuxmail_version }}_linux_{{ tuxmail_arch }}.tar.gz"
tuxmail_archive_url: "{{ tuxmail_release_base_url }}{{ tuxmail_archive_name }}"
tuxmail_checksums_url: "{{ tuxmail_release_base_url }}checksums.txt"
# Alternative: lokale Datei auf dem Steuerrechner (Binary oder .tar.gz).
# Ist der Wert gesetzt, wird nichts heruntergeladen.
tuxmail_binary_src: ""
# Verzeichnis und Binary der gewünschten Version (intern).
tuxmail_version_dir: "{{ tuxmail_install_dir }}/versions/{{ tuxmail_version }}"
tuxmail_version_binary: "{{ tuxmail_version_dir }}/tuxmail"
# Download-Cache auf dem Server.
tuxmail_download_dir: "/var/cache/tuxmail"
# Anzahl installierter Versionen unter /opt/tuxmail/versions (inkl. der aktiven).
tuxmail_keep_versions: 3

# --- config.yaml ---------------------------------------------------------------
tuxmail_log_level: "info" # debug | info | warn | error
tuxmail_log_format: "json" # json | text
# Leer = Ausgabe nach stdout/journald (empfohlen). Sonst z. B. /var/log/tuxmail/tuxmail.log
# (dann wird zusätzlich eine logrotate-Regel angelegt).
tuxmail_log_file: ""
tuxmail_logrotate_keep: 14

# TLS in TuxMail selbst: automatisch "file", wenn kein nginx und eigenes Zertifikat.
tuxmail_server_tls_mode: "{{ 'file' if tuxmail_tls_native | bool else 'none' }}"
# Erlaubt einen Port < 1024 (z. B. 443) ohne nginx (CAP_NET_BIND_SERVICE).
tuxmail_bind_privileged_port: false

# Vertrauenswürdige Proxys (X-Forwarded-For). nginx auf demselben Host wird
# automatisch eingetragen; zusätzliche z. B. für einen vorgelagerten Proxy.
tuxmail_trusted_proxies_extra: []
tuxmail_trusted_proxies: >-
  {{ (['127.0.0.1/32', '::1/128'] if tuxmail_nginx_mode != 'none' else []) + tuxmail_trusted_proxies_extra }}

tuxmail_auth_session_lifetime: "168h"
tuxmail_auth_password_min_length: 12
tuxmail_auth_registration: "disabled" # disabled | invite
tuxmail_auth_totp_required_for_admins: true

tuxmail_oidc_enabled: false
tuxmail_oidc_issuer: "" # z. B. https://cloud.example.org oder https://auth.example.org/application/o/tuxmail/
tuxmail_oidc_client_id: ""
# Geheimnis – bitte mit ansible-vault verschlüsseln (siehe README).
tuxmail_oidc_client_secret: ""
tuxmail_oidc_client_secret_file: "{{ tuxmail_config_dir }}/oidc_client_secret"
tuxmail_oidc_admin_group: "tuxmail-admins"
tuxmail_oidc_user_group: "" # leer = jeder authentifizierte OIDC-Benutzer
tuxmail_oidc_groups_claim: "groups"

tuxmail_login_rate_per_minute: 10

# --- Android-Push über Firebase Cloud Messaging (optional, KONZEPT 15.9) ---------
# JSON-Schlüssel eines Firebase-Dienstkontos (Rolle "Firebase Cloud Messaging API Admin")
# auf dem Steuerrechner, gern mit "ansible-vault encrypt" verschlüsselt. Leer = FCM aus.
# Wird nach tuxmail_fcm_service_account_file kopiert (root:tuxmail 0640) und als
# push.fcm.service_account_file in config.yaml eingetragen.
tuxmail_fcm_service_account_src: ""
tuxmail_fcm_service_account_file: "{{ tuxmail_config_dir }}/fcm-service-account.json"
# Abgeleitet: config.yaml erhält den push-Abschnitt nur, wenn FCM aktiv ist.
tuxmail_fcm_enabled: "{{ tuxmail_fcm_service_account_src | length > 0 }}"


# --- systemd -------------------------------------------------------------------
tuxmail_service_name: "tuxmail"
tuxmail_limit_nofile: 65536
# Zusätzliche Umgebungsvariablen für den Dienst (dict). TuxMail wertet u. a.
# TUXMAIL_LISTEN, TUXMAIL_DATA_DIR, TUXMAIL_PUBLIC_URL, TUXMAIL_LOG_LEVEL aus
# (überschreiben config.yaml – normalerweise nicht nötig).
tuxmail_service_environment: {}
# Härtung für den Chromium-Kindprozess lockern (nur bei tuxmail_pdf_renderer=chromium):
# MemoryDenyWriteExecute=false, Namensräume (außer cgroup) und @privileged-Systemaufrufe
# erlaubt. Auf false setzen, um die volle Härtung zu behalten (Chromium startet dann
# ggf. nicht oder nur ohne eigene Sandbox).
tuxmail_service_chromium_compat: "{{ tuxmail_pdf_renderer == 'chromium' }}"

# --- Health-Check nach (Neu-)Start ------------------------------------------------
tuxmail_healthcheck_enabled: true
tuxmail_healthcheck_retries: 30
tuxmail_healthcheck_delay: 2

# --- Backups -----------------------------------------------------------------------
# zstd (tar.zst) oder gzip (tar.gz)
tuxmail_backup_compression: "zstd"
# Sicherungen enthalten master.key (entschlüsselt alle Benutzer-Geheimnisse) –
# Archive sind 0600 im Verzeichnis 0700. Zusätzlich mit age verschlüsseln, wenn
# hier öffentliche age-Schlüssel (age1...) angegeben sind (empfohlen bei externer Ablage).
tuxmail_backup_age_recipients: []
# Vor einem Versionswechsel /var/lib/tuxmail sichern (Dienst wird dafür kurz gestoppt).
tuxmail_backup_before_upgrade: true
tuxmail_backup_keep_upgrade: 5
# Tägliche Sicherung per systemd-Timer.
tuxmail_backup_timer_enabled: false
tuxmail_backup_timer_oncalendar: "*-*-* 03:15:00"
tuxmail_backup_keep_scheduled: 14
# Dienst während der geplanten Sicherung kurz stoppen (konsistente SQLite-Dateien).
tuxmail_backup_stop_service: true

# --- Erster Administrator -----------------------------------------------------------
tuxmail_admin_create: true
tuxmail_admin_username: "admin"
tuxmail_admin_email: "admin@{{ tuxmail_domain }}"
# Leer = zufälliges Passwort erzeugen und auf dem Steuerrechner unter
# tuxmail_credentials_dir ablegen. Sonst per ansible-vault setzen.
tuxmail_admin_password: ""
tuxmail_admin_password_length: 24
tuxmail_credentials_dir: "{{ playbook_dir }}/credentials/{{ inventory_hostname }}"
