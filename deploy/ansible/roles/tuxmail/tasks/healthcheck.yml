# Prüft GET /healthz direkt am Listener von "tuxmail serve" (nicht über nginx).

- name: Health-Check-Adresse bestimmen
  ansible.builtin.include_tasks: healthcheck_url.yml

- name: Warten, bis TuxMail gesund ist (GET /healthz?deep=1)
  ansible.builtin.uri:
    url: "{{ tuxmail_healthcheck_url }}"
    unix_socket: "{{ tuxmail_socket_path if tuxmail_listen_is_socket | bool else omit }}"
    method: GET
    status_code: 200
    validate_certs: false # lokale Verbindung; Zertifikat lautet auf den öffentlichen Namen
    return_content: false
  register: tuxmail_healthcheck
  until: tuxmail_healthcheck.status == 200
  retries: "{{ tuxmail_healthcheck_retries | int }}"
  delay: "{{ tuxmail_healthcheck_delay | int }}"
  changed_when: false
