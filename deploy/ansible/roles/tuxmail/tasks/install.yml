---
# SPDX-License-Identifier: AGPL-3.0-or-later
# Installiert die gewünschte Version nach /opt/tuxmail/versions/<version>/.
# Mit tuxmail_binary_src bestimmt der Dateiname des Archivs die Version (versions/<v>); ein vorhandenes
# Verzeichnis wird mit dem Archivinhalt abgeglichen (kein creates), sonst bliebe ein altes Binary liegen.
# Der Symlink /opt/tuxmail/current wird erst in activate.yml umgestellt.

- name: Archivname des lokalen Archivs passt zum Muster tuxmail_<version>_linux_<arch>.tar.gz
  ansible.builtin.assert:
    that:
      - >-
        tuxmail_binary_src | basename is match('^tuxmail_[0-9A-Za-z][0-9A-Za-z.+-]*_linux_' ~ tuxmail_arch ~ '\\.(tar\\.gz|tgz)$')
      - >-
        '..' not in (tuxmail_binary_src | basename)
    quiet: true
    fail_msg: >-
      Der Dateiname "{{ tuxmail_binary_src | basename }}" passt nicht zu tuxmail_<version>_linux_{{ tuxmail_arch }}.tar.gz
      (Version: Buchstaben, Ziffern, Punkt, Plus, Minus; kein "..", kein Leerzeichen). Aus dem Namen wird die Version
      bestimmt (versions/<version>); benenne das Archiv so oder gib es als entpacktes Binary an. Es wurde nichts verändert.
  when:
    - tuxmail_binary_src | length > 0
    - tuxmail_binary_src is search('\\.(tar\\.gz|tgz)$')

- name: Version aus dem lokalen Archiv bestimmen
  ansible.builtin.set_fact:
    tuxmail_version: "{{ tuxmail_binary_src | basename | regex_replace('^tuxmail_(.+)_linux_[a-z0-9]+\\.(tar\\.gz|tgz)$', '\\1') }}"
  when:
    - tuxmail_binary_src | length > 0
    - tuxmail_binary_src is search('\\.(tar\\.gz|tgz)$')

- name: Vorhandenes Binary dieser Version suchen
  ansible.builtin.stat:
    path: "{{ tuxmail_version_binary }}"
  register: tuxmail_existing_binary

- name: Unterschied zum vorhandenen Versionsverzeichnis prüfen (nur Vergleich)
  ansible.builtin.unarchive:
    src: "{{ tuxmail_binary_src }}"
    dest: "{{ tuxmail_version_dir }}"
  check_mode: true
  register: tuxmail_version_diff
  when:
    - tuxmail_existing_binary.stat.exists
    - tuxmail_binary_src | length > 0
    - tuxmail_binary_src is search('\\.(tar\\.gz|tgz)$')

- name: Vorhandene Version nicht stillschweigend überschreiben
  ansible.builtin.assert:
    that: not (tuxmail_version_diff.changed | default(false)) or (tuxmail_replace_existing_version | bool)
    quiet: true
    fail_msg: >-
      {{ tuxmail_version_dir }} existiert schon mit anderem Inhalt als {{ tuxmail_binary_src | basename }}. Das ist die aktive
      oder eine Rückweg-Version und wird nicht überschrieben. Gib dem Archiv eine neue Versionsnummer, oder erlaube
      das Ersetzen ausdrücklich mit -e tuxmail_replace_existing_version=true. Es wurde nichts verändert.
  when: tuxmail_version_diff is not skipped

- name: Versionsverzeichnis anlegen
  ansible.builtin.file:
    path: "{{ tuxmail_version_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Prüfen, ob das Release das Server-Archiv enthält
  ansible.builtin.uri:
    url: "{{ tuxmail_archive_url }}"
    method: HEAD
  register: tuxmail_archive_probe
  failed_when: false
  changed_when: false
  check_mode: false
  when: tuxmail_binary_src | length == 0

- name: Server-Archiv ist im Release vorhanden
  ansible.builtin.assert:
    that: tuxmail_archive_probe.status | default(0) | int != 404
    fail_msg: >-
      Das Release v{{ tuxmail_version }} enthält das Archiv {{ tuxmail_archive_name }} nicht
      ({{ tuxmail_archive_url }} liefert 404). Entweder existiert die Version nicht, oder das Release
      ist unvollständig oder das Repository privat. Abhilfe: Archiv selbst bauen
      (build/build-all.sh server --arch {{ tuxmail_arch }}) und mit
      -e tuxmail_binary_src=/pfad/tuxmail_<version>_linux_{{ tuxmail_arch }}.tar.gz installieren,
      oder eine andere Quelle über tuxmail_release_base_url angeben.
    quiet: true
  when: tuxmail_binary_src | length == 0

- name: Herkunft des Releases prüfen (GPG-Signatur von checksums.txt, ND-05)
  ansible.builtin.include_tasks: verify_release.yml
  when:
    - tuxmail_binary_src | length == 0
    - not (tuxmail_allow_unsigned_release | bool)

- name: WARNUNG - unsigniertes Release, nur die Prüfsumme aus dem Release selbst gilt
  ansible.builtin.debug:
    msg: >-
      tuxmail_allow_unsigned_release=true: Die Herkunft von v{{ tuxmail_version }} wird NICHT geprüft
      (kein Abgleich mit tuxmail_release_gpg_fingerprint).
  when:
    - tuxmail_binary_src | length == 0
    - tuxmail_allow_unsigned_release | bool

- name: Release herunterladen und Prüfsumme (sha256) verifizieren
  ansible.builtin.get_url:
    url: "{{ tuxmail_archive_url }}"
    dest: "{{ tuxmail_download_dir }}/{{ tuxmail_archive_name }}"
    # Signiert: SHA-256 aus der per GPG bestätigten checksums.txt; sonst (ausdrücklich erlaubt) aus dem Release.
    checksum: "sha256:{{ tuxmail_checksums_url if tuxmail_allow_unsigned_release | bool else tuxmail_archive_sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: tuxmail_binary_src | length == 0

- name: Release-Archiv entpacken
  ansible.builtin.unarchive:
    src: "{{ tuxmail_download_dir }}/{{ tuxmail_archive_name }}"
    dest: "{{ tuxmail_version_dir }}"
    remote_src: true
    owner: root
    group: root
  notify: tuxmail restart
  when: tuxmail_binary_src | length == 0

- name: Lokales Archiv vom Steuerrechner entpacken
  ansible.builtin.unarchive:
    src: "{{ tuxmail_binary_src }}"
    dest: "{{ tuxmail_version_dir }}"
    owner: root
    group: root
  when:
    - tuxmail_binary_src | length > 0
    - tuxmail_binary_src is search('\.(tar\.gz|tgz)$')

- name: Lokales Binary vom Steuerrechner kopieren
  ansible.builtin.copy:
    src: "{{ tuxmail_binary_src }}"
    dest: "{{ tuxmail_version_binary }}"
    owner: root
    group: root
    mode: "0755"
  notify: tuxmail restart
  when:
    - tuxmail_binary_src | length > 0
    - tuxmail_binary_src is not search('\.(tar\.gz|tgz)$')

- name: Binary ist vorhanden und ausführbar
  ansible.builtin.file:
    path: "{{ tuxmail_version_binary }}"
    state: file
    owner: root
    group: root
    mode: "0755"

- name: Binary läuft auf diesem System (tuxmail version)
  ansible.builtin.command:
    argv: ["{{ tuxmail_version_binary }}", "version"]
  register: tuxmail_version_output
  changed_when: false

- name: Bequemer Aufruf über /usr/local/bin/tuxmail
  ansible.builtin.file:
    src: "{{ tuxmail_binary }}"
    dest: /usr/local/bin/tuxmail
    state: link
    force: true
