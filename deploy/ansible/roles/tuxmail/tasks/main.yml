---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Architektur wird unterstützt
  ansible.builtin.assert:
    that: tuxmail_arch in ['amd64', 'arm64']
    fail_msg: "Nicht unterstützte Architektur: {{ ansible_facts['architecture'] }} (nur amd64/arm64)."
    quiet: true

- name: Release-Signatur ist konfiguriert (oder ausdrücklich abgeschaltet)
  ansible.builtin.assert:
    that: >-
      tuxmail_binary_src | length > 0
      or tuxmail_allow_unsigned_release | bool
      or tuxmail_release_gpg_fingerprint_norm is match('^[0-9A-F]{40}$')
    quiet: true
    fail_msg: >-
      Die Herkunft des Releases kann nicht geprüft werden: tuxmail_release_gpg_fingerprint ist nicht gesetzt.
      Setze den 40-stelligen Fingerabdruck des Release-Schlüssels (inventory/group_vars/all.yml; siehe
      deploy/README.md, Abschnitt "Release-Signatur"), nutze eine lokale Datei (tuxmail_binary_src) oder
      verzichte AUSDRÜCKLICH auf die Prüfung mit tuxmail_allow_unsigned_release: true (nur die Prüfsumme
      aus demselben Release gilt dann). Es wurde nichts installiert oder verändert.

- name: Pakete und Verzeichnisse
  ansible.builtin.import_tasks: directories.yml

- name: Binary installieren (versioniert, noch nicht aktiviert)
  ansible.builtin.import_tasks: install.yml

- name: Konfiguration und Geheimnisse
  ansible.builtin.import_tasks: config.yml

- name: Backup-Skript und optionaler Timer
  ansible.builtin.import_tasks: backup.yml

- name: Version aktivieren (mit Sicherung bei Versionswechsel)
  ansible.builtin.import_tasks: activate.yml

- name: Systemd-Dienst
  ansible.builtin.import_tasks: service.yml

- name: Health-Check
  ansible.builtin.import_tasks: healthcheck.yml
  when: tuxmail_healthcheck_enabled | bool

- name: Ersten Administrator anlegen
  ansible.builtin.import_tasks: admin.yml
  when: tuxmail_admin_create | bool

- name: Alte Versionen aufräumen
  ansible.builtin.import_tasks: prune.yml

- name: Prüfen, ob ein Backup-Schlüssel hinterlegt ist
  ansible.builtin.stat:
    path: "{{ tuxmail_backup_key_dir }}/recipients.txt"
  register: tuxmail_backup_key_file

- name: Hinweis auf den fehlenden Backup-Schlüssel
  ansible.builtin.debug:
    msg: >-
      WARNUNG: Es gibt noch keinen Backup-Schlüssel, deshalb laufen keine Sicherungen. Erzeuge ihn nach dem Rollout
      in der Oberfläche: Einstellungen → Administration → Sicherung.
  when:
    - not tuxmail_backup_key_file.stat.exists
    - not (tuxmail_backup_allow_plaintext | bool)
