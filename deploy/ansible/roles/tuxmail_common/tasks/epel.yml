# SPDX-License-Identifier: AGPL-3.0-or-later
# EPEL einrichten (RHEL-Familie). Aufruf: include_role tuxmail_common, tasks_from epel.yml
- name: EPEL einrichten
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - tuxmail_manage_epel | bool
  block:
    - name: EPEL-Paket aus den Distributions-Repos (Rocky/Alma)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_facts['distribution'] != 'RedHat'

    - name: EPEL-Signaturschlüssel importieren (RHEL)
      ansible.builtin.rpm_key:
        key: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-{{ ansible_facts['distribution_major_version'] }}"
        state: present
      when: ansible_facts['distribution'] == 'RedHat'

    - name: EPEL-Paket installieren (RHEL)
      ansible.builtin.dnf:
        name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
      when: ansible_facts['distribution'] == 'RedHat'
