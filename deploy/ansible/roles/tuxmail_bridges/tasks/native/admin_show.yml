---
# SPDX-License-Identifier: AGPL-3.0-or-later
# Das generierte Passwort steht nur in einer Datei auf dem Steuerrechner (0600, Verzeichnis
# 0700), nie im Play-Protokoll: angezeigt wird nur der Pfad.
- name: Verzeichnis der Zugangsdaten auf dem Steuerrechner schützen (0700)
  ansible.builtin.file:
    path: "{{ tuxmail_bridges_credentials_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: tuxmail_bridges_admin_password_generated | bool

- name: Datei mit dem generierten Passwort schützen (0600)
  ansible.builtin.file:
    path: "{{ tuxmail_bridges_credentials_dir }}/matrix_admin_password"
    state: file
    mode: "0600"
  delegate_to: localhost
  become: false
  when: tuxmail_bridges_admin_password_generated | bool

- name: Zugangsdaten des Matrix-Admin-Kontos anzeigen (nur einmal, ohne Passwort)
  ansible.builtin.debug:
    msg:
      - "Matrix-Admin angelegt: {{ tuxmail_bridges_matrix_admin }} (Homeserver {{ tuxmail_matrix_public_base_url }})"
      - "{{ tuxmail_bridges_show_stored if tuxmail_bridges_admin_password_generated | bool else 'Passwort: aus Vault' }}"
  vars:
    tuxmail_bridges_show_stored: >-
      Passwort (generiert): Datei auf dem Steuerrechner {{ tuxmail_bridges_credentials_dir }}/matrix_admin_password (0600)
      - dort lesen, nicht in Logs kopieren
