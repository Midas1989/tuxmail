# Passwort des Matrix-Admin-Kontos: Vault-Variable oder auf dem Steuerrechner generiert.
- name: Passwort des Matrix-Admin-Kontos bestimmen
  ansible.builtin.set_fact:
    tuxmail_bridges_admin_password: >-
      {{ tuxmail_matrix_admin_password if tuxmail_matrix_admin_password | length > 0
         else lookup('ansible.builtin.password',
                     tuxmail_bridges_credentials_dir ~ '/matrix_admin_password length='
                     ~ (tuxmail_matrix_admin_password_length | string) ~ ' chars=ascii_letters,digits') }}
    tuxmail_bridges_admin_password_generated: "{{ tuxmail_matrix_admin_password | length == 0 }}"
  no_log: true
