---
# SPDX-License-Identifier: AGPL-3.0-or-later
- name: Synapse vorbereiten
  when: tuxmail_bridges_homeserver == 'synapse'
  block:
    - name: Synapse-Datenverzeichnis
      ansible.builtin.file:
        path: "{{ tuxmail_bridges_dir }}/synapse"
        state: directory
        mode: "0750"

    - name: Synapse-Grundkonfiguration erzeugen (einmalig)
      ansible.builtin.command:
        argv: >-
          {{ tuxmail_bridges_run_cmd
             + ['-v', tuxmail_bridges_dir ~ '/synapse:/data' ~ tuxmail_bridges_volume_opts,
                '-e', 'SYNAPSE_SERVER_NAME=' ~ tuxmail_bridges_matrix_server_name,
                '-e', 'SYNAPSE_REPORT_STATS=no',
                tuxmail_bridges_synapse_image, 'generate'] }}
        creates: "{{ tuxmail_bridges_dir }}/synapse/homeserver.yaml"

    - name: Verzeichnis für Appservice-Registrierungen
      ansible.builtin.file:
        path: "{{ tuxmail_bridges_dir }}/synapse/appservices"
        state: directory
        mode: "0755"

- name: Continuwuity-Datenverzeichnis
  ansible.builtin.file:
    path: "{{ tuxmail_bridges_dir }}/continuwuity"
    state: directory
    mode: "0750"
  when: tuxmail_bridges_homeserver == 'continuwuity'
