# Beispiel (aus der Ansible-Rolle tuxmail erzeugt) – Pfade ggf. anpassen.
# TuxMail-Serverkonfiguration – Änderungen bitte über Ansible-Variablen vornehmen.
# Hinweis: "tuxmail check-config" lehnt unbekannte Schlüssel ab.

# Adresse, auf der "tuxmail serve" lauscht: "host:port" oder "unix:/pfad/zum.sock".
listen: "127.0.0.1:8080"

# Öffentliche Basis-URL (Links in Mails, OIDC-Redirects, WebAuthn-Origin).
public_url: "https://mail.example.org"

# Daten aller Benutzer (je Benutzer eigene Datenbank unter users/<id>/).
data_dir: "/var/lib/tuxmail"

log:
  level: "info"
  format: "json"
  # Leer = stdout (journald)
  file: ""

tls:
  # none = TLS terminiert nginx bzw. ein vorgelagerter Proxy; file = TuxMail selbst
  mode: "none"
  cert_file: ""
  key_file: ""

# Proxys, deren X-Forwarded-For/-Proto-Headern vertraut wird.
trusted_proxies:
  - "127.0.0.1/32"
  - "::1/128"

auth:
  session_lifetime: "168h"
  password_min_length: 12
  # disabled | invite
  registration: "disabled"
  totp_required_for_admins: true
  oidc:
    enabled: false
    issuer: ""
    client_id: ""
    client_secret_file: ""
    admin_group: "tuxmail-admins"
    user_group: ""
    groups_claim: "groups"

limits:
  max_upload_mb: 50
  login_rate_per_minute: 10
  # Keep mail sync, workflows, out-of-office and push notifications running
  # for users who are not logged in (users with at least one enabled account).
  background_sync: true
  background_sync_max_users: 500

# Outbound connections (SSRF protection). Users can only make the server
# connect to public addresses; loopback, private networks, link-local and
# cloud metadata addresses are refused for every user-configured destination.
security:
  # true = also allow private networks (RFC 1918, fc00::/7) and loopback for
  # ALL users, e.g. for a mail server in the same LAN.
  allow_private_networks: false
  # Always reachable: IP or CIDR, optionally with a port.
  allowed_networks: []
  #  - "192.168.10.5:993"
  #  - "127.0.0.1:8008"   # local Matrix homeserver
  # true = /healthz and /api/auth/config report the exact program version to
  # anonymous clients (default: false, they only report "product": "tuxmail").
  # Logged-in users and `tuxmail version` always show it.
  expose_version: false
