# Beispiel (aus der Ansible-Rolle tuxmail_nginx erzeugt) – Domain, Pfade und Port anpassen.
# TuxMail Reverse-Proxy für mail.example.org
# TLS: letsencrypt

upstream tuxmail_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# WebSocket-Upgrade (eigener Variablenname, um Konflikte mit vorhandenen
# Konfigurationen zu vermeiden, die bereits $connection_upgrade definieren)
map $http_upgrade $tuxmail_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.example.org;
    server_tokens off;

    # ACME HTTP-01 (Let's Encrypt, certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mail.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TuxMailSSL:10m;
    ssl_session_tickets off;

    # Live-Events per WebSocket
    location /api/events {
        proxy_pass http://tuxmail_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # TuxMail sendet selbst HSTS – nicht doppelt ausliefern
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tuxmail_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Weboberfläche und API (inkl. Long-Polling)
    location / {
        proxy_pass http://tuxmail_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # TuxMail sendet selbst HSTS – nicht doppelt ausliefern
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
