# Beispiel (aus der Ansible-Rolle tuxmail_nginx erzeugt) – Domain, Pfade und Port anpassen.
#
# TuxMail unter /tuxmail/ – zum Einbinden in einen VORHANDENEN
# HTTPS-server-Block (z. B. den von Nextcloud):
#
#     server {
#         ...
#         include /etc/nginx/snippets/tuxmail.conf;
#     }
#
# Danach: nginx -t && systemctl reload nginx
    location = /tuxmail {
        return 301 /tuxmail/;
    }

    # Live-Events per WebSocket
    location /tuxmail/api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /tuxmail;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # TuxMail sendet selbst HSTS – nicht doppelt ausliefern
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Weboberfläche und API (inkl. Long-Polling)
    location /tuxmail/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /tuxmail;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        # TuxMail sendet selbst HSTS – nicht doppelt ausliefern
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 50m;
        proxy_connect_timeout 10s;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
