# yamllint configuration for workflows and packaging files (CI job "packaging-lint").
extends: default
rules:
  line-length:
    max: 160
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
