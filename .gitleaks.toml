# gitleaks configuration (CI job "gitleaks" in .github/workflows/security.yml).
# Default rules plus an allowlist for known non-secrets. Every entry below was
# triaged in docs/security/PENTEST-E-dynamic.md (section "Tool findings").
# Add new entries only with a comment explaining why the match is not a secret.

title = "TuxMail gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Specific test fixtures, known-answer test vectors and documented public values"
paths = [
  # Exactly the fixture files with dummy tokens/passwords/keys (audit L-24: no
  # blanket *_test.go / testdata/ allowlist, so a real secret pasted into a
  # new test file or fixture is still found). Add a file only after triage.
  '''^frontend/src/lib/api/admin\.test\.ts$''',
  '''^internal/app/diagnostics_redact_internal_test\.go$''',
  '''^internal/auth/auth_test\.go$''',
  '''^internal/cloud/vaultwarden/crypto_test\.go$''',
  '''^internal/config/passkeys_apps_test\.go$''',
  '''^internal/messenger/host/env_test\.go$''',
  '''^internal/secretbox/testdata/testvektoren\.json$''',
  '''^internal/server/api_admin_backup_test\.go$''',
  '''^internal/server/background_test\.go$''',
  '''^internal/server/reaudit_ws_test\.go$''',
  '''^internal/server/sicherheit_test\.go$''',
  '''^internal/server/team_test\.go$''',
  '''^internal/server/team_workflow_test\.go$''',
]
# Regexes are matched against the whole rule match (key name + value).
regexTarget = "match"
regexes = [
  # Public OAuth client registration of the ownCloud Infinite Scale desktop
  # client (native app, loopback redirect; not confidential by design, see
  # internal/cloud/opencloud/oidc.go).
  '''UBntmLjC2yYCeHwsyj73Uwo9TAaecAetRwMw0xYcvNL9yRdLSUi0hUAHfvCHFeFh''',
  # Public GPG fingerprint of the Matrix/Synapse APT repository (Ansible role defaults).
  '''tuxmail_synapse_apt_key_fingerprint''',
  # Documentation: names of CI secrets in docs/AUFGABEN-PROJEKTINHABER.md (no values).
  '''Secrets: `MACOS_CERTIFICATE_P12`''',
  # WebSocket handshake nonce from RFC 6455 (sample value in security/pentest/harness.py).
  '''Sec-WebSocket-Key"?:\s*"dGhlIHNhbXBsZSBub25jZQ=="''',
]
