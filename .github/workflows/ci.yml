# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ../build/ci-retry.sh -- npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  go:
    name: Go (vet, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: build/ci-retry.sh -- go mod download
      - run: go vet ./...
      - name: go vet (Windows; setup program and desktop build)
        run: |
          GOOS=windows go vet ./...
          GOOS=windows go vet -tags desktop,production ./cmd/tuxmail ./cmd/tuxmail-setup
      - run: go test -race ./...

  server-binaries:
    name: Server binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [frontend, go]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          version="$(build/version.sh)"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/tuxmail${ext}" ./cmd/tuxmail
          cp LICENSE NOTICE README.md dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tuxmail-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
          retention-days: 14

  versions:
    name: Version consistency (VERSION, mobile/package.json)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: VERSION must match mobile/package.json (docs/RELEASE.md)
        run: build/version.sh --check-tag "v$(build/version.sh --base)"

  packaging-lint:
    name: Packaging lint (workflows, scripts, Dockerfile)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck yamllint desktop-file-utils appstream
          build/ci-retry.sh -- go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: actionlint
        run: actionlint
      - name: yamllint
        run: yamllint -c .yamllint.yml .github build/linux/nfpm.yaml build/docker deploy/docker
      - name: shellcheck
        run: shellcheck -x build/*.sh build/linux/*.sh build/linux/AppRun build/windows/*.sh build/macos/*.sh web/build.sh
      - name: Optional release platforms (macOS) do not block the release
        run: |
          build/release-optional.test.sh
          build/macos/infoplist.test.sh
      # Pinned release binary (SHA-256 checked) instead of a tag-addressed image.
      - name: hadolint
        env:
          HADOLINT_VERSION: v2.12.0
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010 # hadolint-Linux-x86_64
        run: |
          build/ci-fetch.sh "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            "$HADOLINT_SHA256" "$RUNNER_TEMP/hadolint"
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --failure-threshold warning - < build/docker/Dockerfile
      - name: Desktop file and AppStream metadata
        run: |
          desktop-file-validate build/linux/org.tuxmail.TuxMail.desktop
          sed -e 's/@VERSION@/0.0.0/' -e 's/@DATE@/2026-01-01/' build/linux/org.tuxmail.TuxMail.metainfo.xml > "$RUNNER_TEMP/metainfo.xml"
          appstreamcli validate --no-net "$RUNNER_TEMP/metainfo.xml"
