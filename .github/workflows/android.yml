#
# TuxMail Android app (mobile/, Capacitor thin client).
#  - build: frontend check/test/build -> cap sync -> fossDebug APK (always)
#           and playDebug APK (only when the GOOGLE_SERVICES_JSON secret exists)
#  - release (tags v*): signed fossRelease APK, playRelease APK + AAB, attached
#           to the GitHub release. Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#           KEY_ALIAS, KEY_PASSWORD, optional GOOGLE_SERVICES_JSON.

name: Android

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths:
      - 'mobile/**'
      - 'frontend/**'
      - 'locales/**'
      - 'assets/branding/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'frontend/**'
      - 'locales/**'
      - 'assets/branding/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'
  ANDROID_PACKAGES: 'platform-tools platforms;android-36 build-tools;36.0.0'

jobs:
  build:
    name: Build debug APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HAS_PLAY_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Frontend - install, check, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Capacitor sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Build fossDebug (no Google dependencies)
        working-directory: mobile/android
        run: ./gradlew --no-daemon -Ptuxmail.gms=false assembleFossDebug

      - name: Write google-services.json
        if: env.HAS_PLAY_CONFIG == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/src/play/google-services.json

      - name: Build playDebug (FCM)
        if: env.HAS_PLAY_CONFIG == 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assemblePlayDebug

      - name: Remove google-services.json
        if: always()
        run: rm -f mobile/android/app/src/play/google-services.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tuxmail-android-foss-debug
          path: mobile/android/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7.0.2
        if: env.HAS_PLAY_CONFIG == 'true'
        with:
          name: tuxmail-android-play-debug
          path: mobile/android/app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      HAS_PLAY_CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: ${{ env.ANDROID_PACKAGES }}

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true

      - name: Check tag against mobile/package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./mobile/package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match mobile/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Capacitor sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # No release key yet (issue #9): publish a debug-signed test APK instead.
            echo "::warning::secret KEYSTORE_BASE64 is missing - attaching a debug-signed APK"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tuxmail-release.jks"

      - name: Build fossDebug (no release key configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: mobile/android
        run: ./gradlew --no-daemon -Ptuxmail.gms=false assembleFossDebug

      - name: Build fossRelease (F-Droid-compatible, no Google dependencies)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          TUXMAIL_KEYSTORE_FILE: ${{ runner.temp }}/tuxmail-release.jks
          TUXMAIL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUXMAIL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUXMAIL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon -Ptuxmail.gms=false assembleFossRelease

      - name: Write google-services.json
        if: env.HAS_PLAY_CONFIG == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/src/play/google-services.json

      - name: Build playRelease APK + AAB (FCM)
        if: env.HAS_PLAY_CONFIG == 'true' && env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          TUXMAIL_KEYSTORE_FILE: ${{ runner.temp }}/tuxmail-release.jks
          TUXMAIL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUXMAIL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUXMAIL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assemblePlayRelease bundlePlayRelease

      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -f "$RUNNER_TEMP/tuxmail-release.jks" mobile/android/app/src/play/google-services.json
          mkdir -p dist-android
          out=mobile/android/app/build/outputs
          if [ -f "$out/apk/foss/release/app-foss-release.apk" ]; then
            cp "$out/apk/foss/release/app-foss-release.apk" "dist-android/TuxMail-$VERSION-foss.apk"
          else
            cp "$out/apk/foss/debug/app-foss-debug.apk" "dist-android/TuxMail-$VERSION-foss-debug.apk"
          fi
          if [ -d "$out/apk/play/release" ]; then
            cp "$out/apk/play/release/app-play-release.apk" "dist-android/TuxMail-$VERSION-play.apk"
            cp "$out/bundle/playRelease/app-play-release.aab" "dist-android/TuxMail-$VERSION-play.aab"
          fi
          (cd dist-android && sha256sum ./* > SHA256SUMS)
          ls -l dist-android

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tuxmail-android-release
          path: dist-android/*
          if-no-files-found: error

      # Same tag as release.yml: the APKs land in the one release of this version.
      - uses: softprops/action-gh-release@v3.0.3
        with:
          name: TuxMail ${{ steps.version.outputs.version }}
          files: dist-android/*
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
