# Weekly dependency updates; minor/patch updates are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # @types/node follows the Node major used for builds (22, see workflows).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors only after svelte-check/vite support them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images of the server image (tag and digest, build/docker/Dockerfile).
  - package-ecosystem: docker
    directory: /build/docker
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns: ["*"]
    # Node follows the LTS line the CI uses (NODE_VERSION), Go follows go.mod:
    # only patch updates come automatically, the rest is a deliberate switch.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Android Gradle plugin, Kotlin, AndroidX, Firebase BOM, UnifiedPush ...
  # (mobile/android; the Gradle wrapper is validated in android.yml).
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: weekly
    groups:
      android-minor-patch:
        update-types: [minor, patch]
    # Gradle 9.6+ needs the Android Gradle plugin 9 (AGP 8 uses a removed internal
    # API); both are moved together by hand.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major"]
