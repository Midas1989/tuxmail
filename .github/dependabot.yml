# Weekly dependency updates; minor/patch updates are grouped per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # @types/node follows the Node major used for builds (22, see workflows).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors only after svelte-check/vite support them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
