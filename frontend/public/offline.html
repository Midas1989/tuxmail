<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>TuxMail – offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f6fa;
        --fg: #16181d;
        --muted: #5d6573;
        --accent: #1c2b45;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --fg: #e7e9ee;
          --muted: #a2a9b6;
          --accent: #f59e0b;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, 'Noto Sans', sans-serif;
        text-align: center;
      }
      main {
        max-width: 380px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 6px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .btn {
        display: inline-block;
        text-decoration: none;
        font: inherit;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-192.png" width="72" height="72" alt="" />
      <h1>You are offline</h1>
      <p>TuxMail cannot reach the server right now. It will continue as soon as you are back online.</p>
      <p lang="de">Keine Verbindung – TuxMail macht weiter, sobald du wieder online bist.</p>
      <a class="btn" href="./">Try again · Erneut versuchen</a>
    </main>
  </body>
</html>
